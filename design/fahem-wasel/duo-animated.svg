="20.8" r="0.85" fill="#D2591C"/><circle class="stitch" cx="42.6" cy="20.8" r="0.85" fill="#D2591C"/><circle cx="23.5" cy="24" r="1" fill="none" stroke="#D2591C" stroke-width="1.1"/><circle cx="28.6" cy="24" r="1" fill="none" stroke="#D2591C" stroke-width="1.1"/><circle cx="35.4" cy="24" r="1" fill="none" stroke="#D2591C" stroke-width="1.1"/><circle cx="40.5" cy="24" r="1" fill="none" stroke="#D2591C" stroke-width="1.1"/></g></g></g></g>

