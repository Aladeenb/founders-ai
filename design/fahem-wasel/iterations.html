<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fahem &amp; Wasel — options</title>
<style>
body{margin:0;background:#FBF8F3;color:#1B1B1F;font:400 15px/1.5 'IBM Plex Sans',system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:40px 24px 64px}
h1{font:400 34px Georgia,serif;margin:0 0 6px} h2{font:400 24px Georgia,serif;margin:36px 0 14px}
p.lead{color:#55524E;margin:0}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
figure{margin:0;padding:20px;border-radius:22px;background:#fff;border:1px solid #E6E1D8;display:flex;flex-direction:column;align-items:center;gap:12px}
.small{display:flex;gap:12px;align-items:flex-end} .pair{display:flex;gap:10px}
figcaption{text-align:center;font-size:14px;color:#55524E} figcaption b{display:block;font-size:16px;color:#1B1B1F}
@media(max-width:760px){.row{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Fahem &amp; Wasel: pick one of each</h1>
<p class="lead">Fahem is Qatari (blue). Wasel is Omani (orange). Each is shown at 168, 40 and 28 px.</p>
<h2>Round three · heads only</h2><div class="row"><figure><div class="pair"><img src="iterations/fahem-g.svg" width="150" alt=""><img src="iterations/wasel-e.svg" width="150" alt=""></div><div class="small"><img src="iterations/fahem-g.svg" width="40" alt=""><img src="iterations/wasel-e.svg" width="40" alt=""><img src="iterations/fahem-g.svg" width="28" alt=""><img src="iterations/wasel-e.svg" width="28" alt=""></div><figcaption><b>Fahem G + Wasel E</b>Both clean-shaven.</figcaption></figure><figure><div class="pair"><img src="iterations/fahem-g.svg" width="150" alt=""><img src="iterations/wasel-d.svg" width="150" alt=""></div><div class="small"><img src="iterations/fahem-g.svg" width="40" alt=""><img src="iterations/wasel-d.svg" width="40" alt=""><img src="iterations/fahem-g.svg" width="28" alt=""><img src="iterations/wasel-d.svg" width="28" alt=""></div><figcaption><b>Fahem G + Wasel D</b>Fahem clean-shaven, Wasel bearded.</figcaption></figure><figure><div class="pair"><img src="iterations/fahem-h.svg" width="150" alt=""><img src="iterations/wasel-d.svg" width="150" alt=""></div><div class="small"><img src="iterations/fahem-h.svg" width="40" alt=""><img src="iterations/wasel-d.svg" width="40" alt=""><img src="iterations/fahem-h.svg" width="28" alt=""><img src="iterations/wasel-d.svg" width="28" alt=""></div><figcaption><b>Fahem H + Wasel D</b>Fahem with a moustache, Wasel bearded.</figcaption></figure></div>
<h2>Round two · Fahem next to Wasel C</h2><div class="row"><figure><div class="pair"><img src="iterations/fahem-d.svg" width="150" alt=""><img src="iterations/wasel-c.svg" width="150" alt=""></div><div class="small"><img src="iterations/fahem-d.svg" width="40" alt=""><img src="iterations/wasel-c.svg" width="40" alt=""><img src="iterations/fahem-d.svg" width="28" alt=""><img src="iterations/wasel-c.svg" width="28" alt=""></div><figcaption><b>Fahem D + Wasel C</b>Same build as Wasel C: real face, cobra ghutra behind it, happy eyes, short beard.</figcaption></figure><figure><div class="pair"><img src="iterations/fahem-e.svg" width="150" alt=""><img src="iterations/wasel-c.svg" width="150" alt=""></div><div class="small"><img src="iterations/fahem-e.svg" width="40" alt=""><img src="iterations/wasel-c.svg" width="40" alt=""><img src="iterations/fahem-e.svg" width="28" alt=""><img src="iterations/wasel-c.svg" width="28" alt=""></div><figcaption><b>Fahem E + Wasel C</b>Small round glasses, open eyes, soft smile, short beard.</figcaption></figure><figure><div class="pair"><img src="iterations/fahem-f.svg" width="150" alt=""><img src="iterations/wasel-c.svg" width="150" alt=""></div><div class="small"><img src="iterations/fahem-f.svg" width="40" alt=""><img src="iterations/wasel-c.svg" width="40" alt=""><img src="iterations/fahem-f.svg" width="28" alt=""><img src="iterations/wasel-c.svg" width="28" alt=""></div><figcaption><b>Fahem F + Wasel C</b>The older, wise one: small glasses and a fuller beard.</figcaption></figure></div>
<h2>Round one · Fahem</h2><div class="row"><figure><img src="iterations/fahem-a.svg" width="168" alt="Fahem A"><div class="small"><img src="iterations/fahem-a.svg" width="40" alt=""><img src="iterations/fahem-a.svg" width="28" alt=""></div><figcaption><b>Fahem A</b>Cobra ghutra, agal, round glasses, full beard.</figcaption></figure><figure><img src="iterations/fahem-b.svg" width="168" alt="Fahem B"><div class="small"><img src="iterations/fahem-b.svg" width="40" alt=""><img src="iterations/fahem-b.svg" width="28" alt=""></div><figcaption><b>Fahem B</b>Raised cobra crest on the cloth, square glasses, moustache and goatee.</figcaption></figure><figure><img src="iterations/fahem-c.svg" width="168" alt="Fahem C"><div class="small"><img src="iterations/fahem-c.svg" width="40" alt=""><img src="iterations/fahem-c.svg" width="28" alt=""></div><figcaption><b>Fahem C</b>Formal bust: cobra ghutra over a bisht with its trim, full beard.</figcaption></figure></div>
<h2>Wasel · Oman</h2><div class="row"><figure><img src="iterations/wasel-a.svg" width="168" alt="Wasel A"><div class="small"><img src="iterations/wasel-a.svg" width="40" alt=""><img src="iterations/wasel-a.svg" width="28" alt=""></div><figcaption><b>Wasel A</b>Embroidered Omani kumma cap, wink, boxed beard.</figcaption></figure><figure><img src="iterations/wasel-b.svg" width="168" alt="Wasel B"><div class="small"><img src="iterations/wasel-b.svg" width="40" alt=""><img src="iterations/wasel-b.svg" width="28" alt=""></div><figcaption><b>Wasel B</b>Full rounded massar: curved wraps, paisley embroidery, fringed end.</figcaption></figure><figure><img src="iterations/wasel-c.svg" width="168" alt="Wasel C"><div class="small"><img src="iterations/wasel-c.svg" width="40" alt=""><img src="iterations/wasel-c.svg" width="28" alt=""></div><figcaption><b>Wasel C</b>Kumma cap plus the furakha tassel on the dishdasha collar.</figcaption></figure><figure><img src="iterations/wasel-d.svg" width="168" alt="Wasel D"><div class="small"><img src="iterations/wasel-d.svg" width="40" alt=""><img src="iterations/wasel-d.svg" width="28" alt=""></div><figcaption><b>Wasel D</b>Wasel C as a head only: kumma, wink, beard.</figcaption></figure><figure><img src="iterations/wasel-e.svg" width="168" alt="Wasel E"><div class="small"><img src="iterations/wasel-e.svg" width="40" alt=""><img src="iterations/wasel-e.svg" width="28" alt=""></div><figcaption><b>Wasel E</b>Wasel C as a head only: kumma, wink, clean-shaven.</figcaption></figure></div>
</main></body></html>
